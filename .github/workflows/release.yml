# Builds the patch ZIP (launcher + RO3Emu.exe and its client hooks + brand/patch + cloudflared when set) and, for a
# release tag, publishes it as a GitHub Release. Pull requests only build and upload the ZIP as an artifact.
#
# Every branch publishes its own release: release.env holds main's settings (tags v<version>), and a branded branch
# overrides them in brand/release.env (konsor: tags konsor-v<version>). tools/release.py refuses a tag of another
# branch. Release: git tag v1.2.0 && git push origin v1.2.0 (on main), or git tag konsor-v1.2.0 ... (on konsor).
name: release

on:
  push:
    tags: ["v*", "*-v*"]
  pull_request:
    paths:
      - "release.env"
      - "release-notes.md"
      - "brand/**"
      - "tools/package-patch.py"
      - "tools/release.py"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Load the release settings
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          PY=$(command -v python3 || command -v python)
          python_args=(tools/release.py settings)
          if [ -n "$TAG" ]; then python_args+=(--tag "$TAG"); fi
          "$PY" -m unittest tools/test_release.py
          # tr: Python on Windows ends lines with CRLF, which $GITHUB_ENV would keep in the values.
          "$PY" "${python_args[@]}" | tr -d '\r' > settings.env
          cat settings.env >> "$GITHUB_ENV"
          echo "PY=$PY" >> "$GITHUB_ENV"

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: Publish the launcher (single file, win-x64)
        env:
          TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          # A release tag stamps its version (konsor-v1.2.0 -> 1.2.0) so the launcher's self-update can compare it;
          # other builds stay 0.0.0-dev, which never replaces itself with a published launcher.
          version_args=()
          if [ -n "$TAG" ]; then
            VERSION="${TAG#"$TAG_PREFIX"}"
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "tag $TAG does not end in a major.minor.patch version"; exit 1; fi
            version_args=("-p:Version=$VERSION")
          fi
          dotnet publish Ro3Launcher.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true "${version_args[@]}" -o dist
          echo "APP=$(dotnet msbuild Ro3Launcher.csproj -getProperty:AssemblyName | tr -d '\r')" >> "$GITHUB_ENV"

      - name: Download RO3Emu and cloudflared (checksums pinned)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p inputs
          gh release download "$RO3EMU_TAG" --repo "$RO3EMU_REPO" --pattern RO3Emu-win-x64.zip --dir inputs
          echo "$RO3EMU_ZIP_SHA256  inputs/RO3Emu-win-x64.zip" | sha256sum -c -
          "$PY" -m zipfile -e inputs/RO3Emu-win-x64.zip inputs
          # join injects the client/ hooks into the game and refuses to run without them.
          test -f inputs/RO3Emu/client/Ro3Emu.ClientHooks.dll
          cp inputs/RO3Emu/RO3Emu.exe dist/
          cp -r inputs/RO3Emu/client dist/client
          if [ -n "$CLOUDFLARED_TAG" ]; then
            gh release download "$CLOUDFLARED_TAG" --repo cloudflare/cloudflared --pattern cloudflared-windows-amd64.exe --dir inputs
            echo "$CLOUDFLARED_SHA256  inputs/cloudflared-windows-amd64.exe" | sha256sum -c -
            cp inputs/cloudflared-windows-amd64.exe dist/cloudflared.exe
          fi

      - name: Build the patch ZIP and its notes
        run: |
          mkdir -p out
          "$PY" tools/package-patch.py --src dist --exe "$APP.exe" --name "$PACKAGE_NAME" --out "out/$PACKAGE_NAME.zip"
          (cd out && sha256sum "$PACKAGE_NAME.zip" > "$PACKAGE_NAME.zip.sha256")
          "$PY" -m zipfile -l "out/$PACKAGE_NAME.zip"
          "$PY" tools/release.py notes \
            "TAG=${GITHUB_REF_NAME}" \
            "PACKAGE=$PACKAGE_NAME.zip" \
            "LAUNCHER=${GITHUB_REPOSITORY}@${GITHUB_SHA:0:7}" \
            "RO3EMU=$RO3EMU_REPO $RO3EMU_TAG" \
            "CLOUDFLARED=${CLOUDFLARED_TAG:-not included}" \
            "SHA256=$(cut -d' ' -f1 "out/$PACKAGE_NAME.zip.sha256")" > out/notes.md
          echo "$RELEASE_TITLE" > out/title.txt
          cat out/notes.md

      - name: Upload artifact release-bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-bundle
          path: out/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download artifact release-bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bundle
          path: out

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" out/*.zip out/*.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "$(cat out/title.txt) $TAG" --notes-file out/notes.md --verify-tag
